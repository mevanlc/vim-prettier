name: Compatibility Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Targeted Vim smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: Report Yarn version
        run: yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run targeted smoke check
        run: yarn test:smoke

  full-formatting-discovery:
    name: Full formatting suite discovery
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: Report Yarn version
        run: yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run full formatting suite as discovery
        run: yarn test
